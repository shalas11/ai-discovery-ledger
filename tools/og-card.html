<!DOCTYPE html>
<!-- Source for static/og.png, the 1200x630 image shown when a link is shared. Re-render with tools/render-og.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600&family=Newsreader:ital,opsz,wght@0,6..72,600;1,6..72,400&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #fdfdfc; color: #111111; padding: 0 72px; font-family: "Newsreader", Georgia, serif; text-align: center; }
  .top { padding: 44px 0 18px; border-bottom: 2px solid #111111; font: 600 20px "Libre Franklin", Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #5a5a5a; }
  h1 { margin: 104px 0 0; font-size: 112px; font-weight: 600; line-height: 1; letter-spacing: -.025em; white-space: nowrap; }
  p { margin: 30px 0 0; font-size: 38px; font-style: italic; color: #5a5a5a; }
  .fields { position: absolute; left: 72px; right: 72px; bottom: 46px; padding: 22px 0; border-top: 6px double #111111; border-bottom: 2px solid #111111; display: flex; justify-content: space-between; font: 600 19px "Libre Franklin", Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  .fields span:first-child { color: #b3261e; }
</style>
</head>
<body>
  <div class="top">Logged daily · aidiscoveryledger.com</div>
  <h1>AI Discovery Ledger</h1>
  <p>News of discoveries made by AI systems</p>
  <div class="fields"><span>Latest</span><span>Mathematics</span><span>Computer science</span><span>Physics</span><span>Biology</span><span>Medicine</span></div>
</body>
</html>
