<!DOCTYPE html>
<!-- Source for static/og.png, the 1200x630 image shown when a link is shared. Re-render with tools/render-og.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #edf0ee; color: #0f1e28; padding: 62px 76px 0; position: relative; font-family: "Source Serif 4", Georgia, serif; }
  .kicker { font: 600 22px "IBM Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: #54646e; }
  h1 { font: 800 148px/0.9 "Bricolage Grotesque", sans-serif; letter-spacing: -.04em; margin: 26px 0 30px; }
  h1 span { color: #2a3fd4; }
  p { font-size: 35px; line-height: 1.32; margin: 0; max-width: 23em; }
  .grades { position: absolute; left: 76px; right: 76px; bottom: 50px; padding-top: 24px; border-top: 3px solid #0f1e28; display: flex; justify-content: space-between; align-items: flex-end; font: 600 21px "IBM Plex Mono", monospace; color: #54646e; letter-spacing: .02em; }
  .grades span:last-child { color: #2a3fd4; }
</style>
</head>
<body>
  <div class="kicker">Logged daily</div>
  <h1>AI Discovery <span>Ledger</span></h1>
  <p>News of discoveries made by AI systems, logged daily with sources and what is still unverified.</p>
  <div class="grades"><span>Mathematics</span><span>Computer science</span><span>Biology</span><span>Medicine</span><span>Physics</span><span>aidiscoveryledger.com</span></div>
</body>
</html>
